
{% extends "base.html" %}

{% block title %}Register | CarpoolConnect{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="auth-icon">C</span>
            <h1>Create Account</h1>
            <p>Join CarpoolConnect and start sharing journeys.</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       minlength="8"
                       placeholder="Minimum 8 characters" required>
            </div>

            <div class="form-group">
                <label for="account-type">Account Type</label>
                <select id="account-type" required>
                    <option value="rider">Rider</option>
                    <option value="driver">Driver</option>
                </select>
            </div>

            <p id="register-message" class="form-message"></p>

            <button type="submit" class="btn btn-primary auth-submit">
                Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already registered?
            <a href="{{ url_for('pages.login_page') }}">Login</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const message = document.getElementById("register-message");
    const button = e.target.querySelector("button[type='submit']");

    button.disabled = true;
    button.textContent = "Creating account...";
    message.textContent = "";

    try {
        const response = await fetch("/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                password: document.getElementById("password").value,
                is_driver: document.getElementById("account-type").value === "driver"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Registration failed");
        }

        message.textContent = "Registration successful! Redirecting to login...";
        message.className = "form-message success";

        setTimeout(() => {
            window.location.href = "/login";
        }, 1200);

    } catch (error) {
        message.textContent = error.message;
        message.className = "form-message error";
    } finally {
        button.disabled = false;
        button.textContent = "Create Account";
    }
});
</script>
{% endblock %}
